# InceptionRAG Configuration
# Copy from config.yaml.template and fill in your API credentials

#llm:
#  provider: "openai"               # openai / azure / custom / hf
#  api_key: ""                  # unused for local HF models
#  api_base: ""                 # optional custom endpoint
#  model: "gpt-4o-mini" # local HF model name

llm:
  provider: "hf"
  api_key: "EMPTY"
  api_base: "http://localhost:8000/v1"
  model: "Qwen/Qwen2.5-3B-Instruct" #"zai-org/GLM-5.3"
  llm_judge_model: "Qwen/Qwen2.5-7B-Instruct"
  
data:
  dataset: "hotpotqa"
  data_root: "/tmp/masoo20/inception_rag"

attack: 
  retrieval_top_k: 20
  retrieval_first_k: 50
  cttft_neighbor_k: 1
  noise_injection: true
  dual_injection: true
  
attack_changes:
  chunk: false
  chunking_strategy: "word-based"
  chunk_size: 100
  chunk_overlap: 12
  reranker: false
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  reranker_top_k: 5

defenses:
  hodor:
    use_hodor: False
    hodor_model: "Qwen/Qwen2.5-3B-Instruct"
  trustrag:
    use_trustrag: false
    stage1: True
    stage2: True
    embedding_model: "princeton-nlp/sup-simcse-bert-base-uncased"
    rouge_threshold: 0.25
    cohesion_threshold: 0.85
  robustrag:
    use_robustrag: True
    relative_threshold: 0.2
    absolute_threshold: 3
    abstention_threshold: 1
    max_tokens: 100

