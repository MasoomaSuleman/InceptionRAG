# InceptionRAG Configuration
# Copy from config.yaml.template and fill in your API credentials

  
llm:
  provider: "hf"
  api_key: "EMPTY"
  api_base: "http://localhost:8000/v1"
  model: "Qwen/Qwen2.5-3B-Instruct" #"zai-org/GLM-5.3"
  llm_judge_model: "Qwen/Qwen2.5-3B-Instruct"

attack: 
  retrieval_top_k: 20
  retrieval_first_k: 50
  cttft_neighbor_k: 10
  noise_injection: true
  dual_injection: true
  
attack_changes:
  chunk: false
  chunking_strategy: "token-based"
  chunk_size: 256
  chunk_overlap: 32
  reranker: true
  reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  reranker_top_k: 5
  

defenses:
  filterrag:
    enabled: false
    epsilon: 0.2
    semantic_threshold: 0.6
    slm_model: "meta-llama/Meta-Llama-3-8B-Instruct"
    max_new_tokens: 64